services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
    networks:
      - app-network

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    environment:
      - PORT=3200
      - FILE_SERVICE_URL=http://file-service:3100
      - DATA_SERVICE_URL=http://factory-operations-api:3300
    networks:
      - app-network
    depends_on:
      - file-service
      - factory-operations-api

  factory-operations-api:
    build:
      context: ./factory-operations-api
      dockerfile: Dockerfile
    ports:
      - "3300:3300"
    environment:
      - PORT=3300
      - MONGODB_URI=mongodb://mongodb:27017/factory-operations
      - KAFKA_BROKER=kafka:29092
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  factory-operations-orchestrator:
    build:
      context: ./factory-operations-orchestrator
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=kafka:29092
      - DOCKER_NETWORK=distributed-system_app-network
      - FACTORY_IMAGE=factory-process
      - CONVEYOR_IMAGE=conveyor-process
      - WORKER_IMAGE=worker-process
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # Ephemeral process images — built by compose but never started directly.
  # The orchestrator launches these dynamically via the Docker API.
  factory-process:
    build:
      context: ./factory-operations/factory
      dockerfile: Dockerfile
    image: factory-process
    profiles: [build-only]

  conveyor-process:
    build:
      context: ./factory-operations/conveyor
      dockerfile: Dockerfile
    image: conveyor-process
    profiles: [build-only]

  worker-process:
    build:
      context: ./factory-operations/worker
      dockerfile: Dockerfile
    image: worker-process
    profiles: [build-only]

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
